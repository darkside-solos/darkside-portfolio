<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkside Solos | Official</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; font-family: 'Inter', sans-serif; background: #000; overflow-x: hidden; color: white; }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.8s ease;
        }
        .loader-ring {
            width: 80px; height: 80px; border: 4px solid rgba(255, 69, 0, 0.1);
            border-top: 4px solid #ff4500; border-radius: 50%;
            animation: spin 1s linear infinite; box-shadow: 0 0 15px #ff4500;
        }
        .loader-text {
            margin-top: 20px; font-family: 'Orbitron', sans-serif; color: #ff8c00;
            letter-spacing: 3px; font-size: 0.8rem; animation: pulse 1.5s infinite;
        }

        /* --- BACKGROUND WITH ZOOM --- */
        .main-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: url('https://files.catbox.moe/q8q54m.jpg') center/cover no-repeat;
            filter: brightness(0.6); transform: scale(1);
            transition: transform 0.5s ease-out;
        }

        .profile-container {
            min-height: 130vh; display: flex; align-items: flex-start; justify-content: center; 
            padding-top: 8vh; padding-bottom: 15vh;
        }

        /* --- GLASS TILES --- */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 40px;
            padding: 40px 20px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: sticky; top: 8vh;
        }

        .profile-img {
            width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ff4500;
            margin: 0 auto 20px; background: url('https://files.catbox.moe/w2mevz.jpg') center/cover;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.8);
        }

        h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 2.5rem; margin-bottom: 25px; 
            color: #fff; text-shadow: 0 0 15px #ff4500;
        }

        .links-stack { display: flex; flex-direction: column; gap: 12px; }
        .tile {
            background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px; border-radius: 22px; text-decoration: none; color: white;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.3s ease;
        }
        .tile:hover { background: rgba(255, 255, 255, 0.15); }
        
        .tile-left { display: flex; align-items: center; gap: 12px; }
        .tile-left img { width: 32px; height: 32px; object-fit: contain; }
        .tile-name { font-weight: 700; font-size: 1rem; }
        
        .copy-btn { background: #ff4500; border: none; color: white; padding: 10px 18px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        /* --- MUSIC PLAYER --- */
        .music-ui {
            background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 15px; margin-bottom: 25px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .music-btn { cursor: pointer; color: #ff4500; font-size: 1.5rem; }
        #volume-slider { width: 100px; accent-color: #ff4500; cursor: pointer; }

        /* --- ANIMATIONS --- */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #toast {
            visibility: hidden; min-width: 180px; background: #ff4500; color: white;
            padding: 12px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            border-radius: 50px; font-weight: 800; z-index: 10001; text-align: center;
        }
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">INITIALIZING SYSTEM...</div>
    </div>

    <div class="main-bg" id="bg-layer"></div>
    <audio id="bg-music" loop playsinline><source src="music.mp3" type="audio/mpeg"></audio>

    <div class="profile-container">
        <div class="card">
            <div class="profile-img"></div>
            <h1>DARKSIDE</h1>
            
            <div class="music-ui">
                <i id="play-btn" class="fas fa-play music-btn" onclick="toggleMusic()"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>

            <div class="links-stack">
                <a href="https://wa.me/233530729233" class="tile">
                    <div class="tile-left">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
                        <span class="tile-name">WhatsApp</span>
                    </div>
                </a>

                <a href="https://t.me/darkside_solos" class="tile">
                    <div class="tile-left">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
                        <span class="tile-name">Telegram</span>
                    </div>
                </a>

                <div class="tile">
                    <div class="tile-left">
                        <img src="https://files.catbox.moe/p0clnc.jpg" alt="Free Fire">
                        <span class="tile-name">Free Fire MAX</span>
                    </div>
                    <button class="copy-btn" onclick="copyUID('8443778220')">COPY</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">✅ UID COPIED!</div>

    <script>
        const music = document.getElementById("bg-music");
        const playBtn = document.getElementById("play-btn");
        const bgLayer = document.getElementById("bg-layer");
        const loader = document.getElementById("loader");

        // Hide loader when page is ready
        window.addEventListener('load', () => {
            setTimeout(() => {
                loader.style.opacity = "0";
                setTimeout(() => { loader.style.display = "none"; }, 800);
            }, 1500); // 1.5s delay to show off the loader
        });

        // Zoom effect
        window.addEventListener('scroll', () => {
            let zoom = 1 + (window.scrollY / 2500); 
            if (zoom <= 1.3) bgLayer.style.transform = `scale(${zoom})`;
        });

        function toggleMusic() {
            if (music.paused) { 
                music.play(); 
                playBtn.className = "fas fa-pause music-btn"; 
            } else { 
                music.pause(); 
                playBtn.className = "fas fa-play music-btn"; 
            }
        }

        document.getElementById("volume-slider").addEventListener("input", (e) => {
            music.volume = e.target.value;
        });
        
        function copyUID(uid) {
            navigator.clipboard.writeText(uid).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = ""; }, 3000);
            });
        }
    </script>
</body>
</html>
