<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkside Solos | Official</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; color: white; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }

        /* SHARP BACKGROUND IMAGE */
        .main-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: url('https://files.catbox.moe/q8q54m.jpg') center/cover no-repeat;
            filter: brightness(0.65); /* Made slightly lighter as requested */
            opacity: 0; transition: opacity 1s ease;
        }

        /* 1. WELCOME SECTION */
        .welcome-section {
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; background: #000; position: relative; z-index: 2;
        }
        .welcome-section h2 { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: #ff8c00; text-shadow: 0 0 15px #ff4500; }
        .scroll-hint { margin-top: 50px; animation: bounce 2s infinite; color: #ff4500; font-size: 2.5rem; }

        /* 2. PROFILE SECTION */
        .profile-container {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            padding: 60px 20px; position: relative;
        }

        /* MINIMAL BLUR CARD - For maximum image visibility */
        .card {
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(4px); /* Reduced from 8px for sharpness */
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px;
            padding: 45px 20px; width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .profile-img {
            width: 130px; height: 130px; border-radius: 50%; border: 3px solid #ff4500;
            margin: 0 auto 20px; background: url('https://files.catbox.moe/w2mevz.jpg') center/cover;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.8);
        }

        h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 2.8rem; margin-bottom: 25px; 
            color: #fff; text-shadow: 0 0 10px #ff8c00, 0 0 20px #ff4500;
            animation: pulseGlow 2s infinite alternate;
        }

        /* TILES & LOGOS */
        .links-stack { display: flex; flex-direction: column; gap: 15px; }
        .tile {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px; border-radius: 20px; text-decoration: none; color: white;
            display: flex; align-items: center; justify-content: space-between;
        }
        
        .tile-left { display: flex; align-items: center; gap: 15px; }
        .tile-left img { width: 35px; height: 35px; object-fit: contain; }
        .tile-name { font-weight: 700; font-size: 1.1rem; }
        
        .copy-btn { background: #ff4500; border: none; color: white; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        /* MUSIC UI */
        .music-ui {
            background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 15px; margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .music-btn { cursor: pointer; color: #ff4500; font-size: 1.8rem; transition: transform 0.2s; }
        .music-btn:active { transform: scale(1.2); }
        #volume-slider { width: 110px; accent-color: #ff4500; cursor: pointer; }

        #toast {
            visibility: hidden; min-width: 200px; background: #ff4500; color: white;
            padding: 15px; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            border-radius: 50px; font-weight: 800; z-index: 9999; text-align: center;
        }
        #toast.show { visibility: visible; }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 10px #ff8c00, 0 0 20px #ff4500; }
            to { text-shadow: 0 0 20px #ff8c00, 0 0 40px #ff4500, 0 0 60px #ff0000; }
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-12px);} }
    </style>
</head>
<body>

    <div class="main-bg" id="bg-img"></div>

    <audio id="bg-music" loop playsinline><source src="music.mp3" type="audio/mpeg"></audio>

    <div class="welcome-section">
        <h2>Welcome to my page</h2>
        <p> You can text me if you wanna know how i created this<p>
        <p>Swipe up for the full experience...</p>
        <div class="scroll-hint"><i class="fas fa-chevron-down"></i></div>
    </div>

    <div class="profile-container" id="profile-section">
        <div class="card">
            <div class="profile-img"></div>
            <h1>DARKSIDE</h1>
            
            <div class="music-ui">
                <i id="play-btn" class="fas fa-play music-btn" onclick="toggleMusic()"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>

            <div class="links-stack">
                <a href="https://wa.me/233530729233" class="tile">
                    <div class="tile-left">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA">
                        <span class="tile-name">WhatsApp</span>
                    </div>
                </a>

                <a href="https://t.me/darkside_solos" class="tile">
                    <div class="tile-left">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="TG">
                        <span class="tile-name">Telegram</span>
                    </div>
                </a>

                <div class="tile">
                    <div class="tile-left">
                        <img src="https://files.catbox.moe/p0clnc.jpg" alt="FF">
                        <span class="tile-name">Free Fire MAX</span>
                    </div>
                    <button class="copy-btn" onclick="copyVal('8443778220')">COPY</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">✅ UID COPIED!</div>

    <script>
        const bgImg = document.getElementById('bg-img');
        const profile = document.getElementById('profile-section');
        const music = document.getElementById("bg-music");
        const playBtn = document.getElementById("play-btn");

        window.addEventListener('scroll', () => {
            const rect = profile.getBoundingClientRect();
            if (rect.top < window.innerHeight) {
                bgImg.style.opacity = "1";
            }
        });

        function toggleMusic() {
            if (music.paused) { 
                music.play(); 
                playBtn.className = "fas fa-pause music-btn"; 
            } else { 
                music.pause(); 
                playBtn.className = "fas fa-play music-btn"; 
            }
        }

        document.getElementById("volume-slider").addEventListener("input", (e) => {
            music.volume = e.target.value;
        });
        
        function copyVal(val) {
            navigator.clipboard.writeText(val).then(() => {
                const t = document.getElementById("toast");
                t.className = "show";
                setTimeout(() => { t.className = ""; }, 3000);
            });
        }
    </script>
</body>
</html>
