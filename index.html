<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkside Solos | Official</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; color: white; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }

        /* 1. WELCOME SECTION */
        .welcome-section {
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; background: #000;
        }
        .welcome-section h2 { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #ff8c00; text-shadow: 0 0 15px #ff4500; }
        .scroll-hint { margin-top: 50px; animation: bounce 2s infinite; color: #ff4500; font-size: 2.5rem; }

        /* 2. PROFILE SECTION */
        .profile-container {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            padding: 60px 20px; position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 40px;
            padding: 45px 20px; width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .profile-img {
            width: 130px; height: 130px; border-radius: 50%; border: 3px solid #ff4500;
            margin: 0 auto 20px; background: url('https://files.catbox.moe/w2mevz.jpg') center/cover;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.8);
        }

        h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 2.8rem; margin-bottom: 25px; 
            color: #fff; text-shadow: 0 0 10px #ff8c00, 0 0 20px #ff4500;
            animation: pulseGlow 2s infinite alternate;
        }

        /* 3. VIDEO SECTION */
        .video-wrapper {
            width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #000; overflow: hidden;
        }
        #bg-video {
            width: 100%; height: 100%; object-fit: cover; filter: brightness(0.9);
        }

        /* TILES WITH LOGOS */
        .links-stack { display: flex; flex-direction: column; gap: 15px; }
        .tile {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 18px; border-radius: 20px; text-decoration: none; color: white;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.3s;
        }
        .tile:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.2); }
        
        .tile-left { display: flex; align-items: center; gap: 15px; }
        .tile-left img { width: 35px; height: 35px; object-fit: contain; }
        .tile-name { font-weight: 700; font-size: 1.1rem; }
