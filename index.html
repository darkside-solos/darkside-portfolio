<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkside | Official</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; background: #000; color: white; overflow-x: hidden; font-family: 'Inter', sans-serif; }

        /* Full Screen Background & Fire Overlay */
        #bg-video, #particles-js {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -100;
            object-fit: cover; filter: brightness(0.25);
        }

        .container {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; padding: 40px 20px; width: 100%; max-width: 420px;
            text-align: center; box-shadow: 0 0 60px rgba(0,0,0,1);
        }

        .profile-img {
            width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ff4500;
            margin: 0 auto 15px; 
            background: url('https://files.catbox.moe/w2mevz.jpg') center/cover; /* NEW PHOTO LINK */
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.5);
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #fff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .sub { color: #ff8c00; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 30px; }

        /* Links Stack */
        .links-stack { display: flex; flex-direction: column; gap: 12px; }
        
        .tile {
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 18px; border-radius: 20px; text-decoration: none; color: white;
            display: flex; align-items: center; justify-content: space-between; transition: 0.3s;
        }
        .tile:hover { background: rgba(255, 69, 0, 0.1); border-color: #ff4500; transform: scale(1.02); }
        
        .tile-left { display: flex; align-items: center; gap: 12px; text-align: left; }
        .tile-left img { width: 30px; height: 30px; object-fit: contain; }
        
        .label { font-size: 0.6rem; color: #999; font-weight: 800; text-transform: uppercase; }
        .value { font-size: 0.9rem; font-weight: 700; }

        .copy-btn { background: #ff4500; border: none; color: white; padding: 8px 14px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.7rem; }

        /* Hidden Toast for Copy Success */
        #toast {
            visibility: hidden; min-width: 180px; background: #ff4500; color: white;
            padding: 12px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            border-radius: 50px; font-weight: 800; z-index: 9999; font-size: 0.8rem;
        }
        #toast.show { visibility: visible; animation: pop 0.4s; }
        @keyframes pop { from {opacity: 0; bottom: 10px;} to {opacity: 1; bottom: 30px;} }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="https://files.catbox.moe/fga606.mp4" type="video/mp4">
    </video>
    
    <div id="particles-js"></div>
    
    <audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div class="container">
        <div class="card">
            <div class="profile-img"></div>
            <h1>Darkside</h1>
            <p class="sub">Makes codes for fun.</p>
            
            <div class="links-stack">
                <a href="https://wa.me/233530729233" class="tile">
                    <div class="tile-left">
                        <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WA">
                        <div><p class="label">WhatsApp</p><p class="value">+233 530 729 233</p></div>
                    </div>
                    <i class="fas fa-external-link-alt" style="font-size:0.7rem; opacity:0.3;"></i>
                </a>

                <a href="https://t.me/darkside_solos" class="tile">
                    <div class="tile-left">
                        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="TG">
                        <div><p class="label">Telegram</p><p class="value">@darkside_solos</p></div>
                    </div>
                    <i class="fas fa-external-link-alt" style="font-size:0.7rem; opacity:0.3;"></i>
                </a>

                <div class="tile" onclick="copyVal('8443778220')" style="cursor:pointer">
                    <div class="tile-left">
                        <img src="https://w7.pngwing.com/pngs/423/116/png-transparent-garena-free-fire-battlegrounds-logo-game-thumbnail.png" alt="FF">
                        <div><p class="label">Free Fire UID</p><p class="value">8443778220</p></div>
                    </div>
                    <button class="copy-btn">COPY</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">✅ COPIED!</div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Start Fire Ember Effect
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 100 },
                "color": { "value": ["#ff4500", "#ff8c00", "#ffcc00"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.8, "random": true },
                "size": { "value": 3, "random": true },
                "move": { "enable": true, "speed": 3.5, "direction": "bottom", "out_mode": "out" }
            }
        });

        const music = document.getElementById("bg-music");
        
        // Copy UID function
        function copyVal(val) {
            navigator.clipboard.writeText(val).then(() => {
                const t = document.getElementById("toast");
                t.className = "show";
                setTimeout(() => { t.className = ""; }, 3000);
            });
        }
        
        // Autoplay music on first touch
        document.body.addEventListener('click', () => { music.play(); }, { once: true });
    </script>
</body>
</html>
