<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkside Solos | Official</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; color: white; font-family: 'Inter', sans-serif; scroll-behavior: smooth; overflow-x: hidden; min-height: 200vh; }

        #bg-video, #particles-js {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -100;
            object-fit: cover; filter: brightness(0.2);
        }

        /* 1. TOP WELCOME SECTION */
        .welcome-section {
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; position: relative;
        }
        .welcome-section h2 { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; color: #ff8c00; margin-bottom: 15px; letter-spacing: 2px; }
        .welcome-section p { font-size: 1rem; color: #bbb; max-width: 320px; line-height: 1.6; }
        .scroll-hint { position: absolute; bottom: 30px; animation: bounce 2s infinite; color: #ff4500; font-size: 1.5rem; }

        /* 2. PROFILE SECTION */
        .profile-container {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px;
            padding: 45px 20px; width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 0 80px rgba(0,0,0,1);
        }

        .profile-img {
            width: 125px; height: 125px; border-radius: 50%; border: 3px solid #ff4500;
            margin: 0 auto 15px; background: url('https://files.catbox.moe/w2mevz.jpg') center/cover;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.5);
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; margin-bottom: 25px; letter-spacing: 2px; }

        .music-ui {
            background: rgba(0,0,0,0.5); border-radius: 20px; padding: 15px; margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center; gap: 15px; border: 1px solid rgba(255, 69, 0, 0.2);
        }
        .music-btn { cursor: pointer; color: #ff4500; font-size: 1.4rem; }
        #volume-slider { width: 90px; accent-color: #ff4500; cursor: pointer; }

        .links-stack { display: flex; flex-direction: column; gap: 15px; }
        .tile {
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px; border-radius: 22px; text-decoration: none; color: white;
            display: flex; align-items: center; justify-content: space-between;
        }
        .tile-left { display: flex; align-items: center; gap: 15px; }
        .tile-left img { width: 34px; height: 34px; object-fit: contain; }
        .tile-name { font-weight: 700; font-size: 1.1rem; }
        .tile-id { font-family: monospace; font-size: 1rem; color: #aaa; }

        .copy-btn { background: #ff4500; border: none; color: white; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        #toast {
            visibility: hidden; min-width: 180px; background: #ff4500; color: white;
            padding: 12px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            border-radius: 50px; font-weight: 800; z-index: 9999; text-align: center;
        }
        #toast.show { visibility: visible; animation: pop 0.4s; }

        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
        @keyframes pop { from {opacity: 0; bottom: 10px;} to {opacity: 1; bottom: 30px;} }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="https://files.catbox.moe/fga606.mp4" type="video/mp4">
    </video>
    <div id="particles-js"></div>
    <audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <div class="welcome-section">
        <h2 data-aos="fade-up">Welcome to my page</h2>
        <p data-aos="fade-up" data-aos-delay="200">
            Just a developer who makes codes for fun or when bored... Enjoy the music.
        </p>
        <div class="scroll-hint"><i class="fas fa-chevron-down"></i></div>
    </div>

    <div class="profile-container">
        <div class="card" data-aos
